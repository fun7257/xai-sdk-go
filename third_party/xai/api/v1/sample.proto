syntax = "proto3";

package xai_api;
option go_package = "github.com/fun7257/xai-sdk-go/xai/api/v1;xaiv1";

// Shared sampling enums used by Chat (and formerly by the unused Sample service).
// The Sample RPC surface is intentionally omitted from this SDK (chat Sample/Samples
// cover product completions). FinishReason remains because chat.proto imports it.

// Reasons why the model stopped sampling.
enum FinishReason {
  // Invalid reason.
  REASON_INVALID = 0;

  // The max_len parameter specified on the input is reached.
  REASON_MAX_LEN = 1;

  // The maximum context length of the model is reached.
  REASON_MAX_CONTEXT = 2;

  // One of the stop words was found.
  REASON_STOP = 3;

  // A tool call is included in the response.
  REASON_TOOL_CALLS = 4;

  // Time limit has been reached.
  REASON_TIME_LIMIT = 5;
}
