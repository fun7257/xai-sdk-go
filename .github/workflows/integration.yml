# Optional live smoke against xAI. Never required for PR merge.
#
# Triggers: manual + weekly schedule.
# Without repository secret XAI_API_KEY the job exits 0 (skip).
# See docs/CI.md.
name: integration

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Integration smoke (skip if no secret)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "${XAI_API_KEY}" ]; then
            echo "XAI_API_KEY secret not configured; skipping live smoke (exit 0)"
            exit 0
          fi
          go test -tags=integration ./integration/ -count=1 -v -timeout 5m
