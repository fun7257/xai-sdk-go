# Optional live smoke. Not run on pull_request.
# On schedule/dispatch: skips cleanly when repository secret XAI_API_KEY is unset.
name: integration

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Integration smoke (skip if no secret)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SMOKE_SKIP_IMAGE: "1"
          SMOKE_SKIP_VIDEO: "1"
        run: |
          if [ -z "${XAI_API_KEY}" ]; then
            echo "XAI_API_KEY secret not configured; skipping live smoke (exit 0)"
            exit 0
          fi
          go test -tags=integration ./integration/ -count=1 -v -timeout 5m
