# Compatible with golangci-lint v1.64+ and v2 (version field required by v2).
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Best-effort closes on defers in happy-path cleanup.
        - (*os.File).Close
        - io.Closer.Close
  exclusions:
    paths:
      - xai/api
      - third_party
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: examples/
        linters:
          - errcheck
