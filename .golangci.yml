run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    exclude-functions:
      # Best-effort closes on defers in happy-path cleanup.
      - (*os.File).Close
      - io.Closer.Close

issues:
  exclude-dirs:
    - xai/api
    - third_party
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: examples/
      linters:
        - errcheck
